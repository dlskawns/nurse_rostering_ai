<!-- =========================================
  Nurse Scheduling UI – Static Mockup (HTML/CSS/JS)
  페이지: 1) 개인 근무표, 2) 전체 근무표, 3) 간호부장/수간호사 근무표 생성‧수정
  모든 동적 데이터‧API 연동 지점은 '-------------mock data-------------' 주석으로 표시
  디자인 팔레트는 첨부 스크린샷을 참고해 가까운 색상으로 지정
========================================= -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nurse Schedule UI Mock</title>
  <style>
    :root {
      /* Shift 색상 */
      --day: #4ecbfa;
      --eve: #f4c23d;
      --nig: #4e6fae;
      --off: #f4818c;
      /* 기타 */
      --text-dark: #333;
      --bg-light: #fafafa;
      --lock: #213a5a;
    }

    body {
      font-family: "Pretendard", Arial, sans-serif;
      margin: 0;
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.4;
    }

    h2 {
      margin: 1.2rem 0 0.5rem;
      font-size: 1.4rem;
    }

    /* 공통 캘린더 테이블 */
    table.calendar {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.calendar th,
    table.calendar td {
      text-align: center;
      padding: 6px 2px;
      border: 1px solid #e0e0e0;
    }
    table.calendar th {
      background: #fff;
      font-weight: 600;
    }

    /* 셀 안 배지 */
    .badge {
      display: inline-block;
      min-width: 36px;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #fff;
      position: relative;
      cursor: default;
      user-select: none;
      transition: transform .15s;
    }
    .badge.locked::after {
      content: "\1F512"; /* 🔒 */
      font-size: 0.65rem;
      position: absolute;
      right: -10px;
      top: -4px;
    }
    .badge.Day { background: var(--day); }
    .badge.Eve { background: var(--eve); color: #444; }
    .badge.Nig { background: var(--nig); }
    .badge.Off { background: var(--off); }

    /* 편집 모드를 위한 상단 버튼 */
    #editToolbar {
      display: none; /* 편집 시작 시 flex 로 변경 */
      gap: 8px;
      margin: 12px 0;
    }
    #editToolbar button {
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #fff;
      cursor: pointer;
      transform: scale(1);
      transition: transform .15s;
    }
    #editToolbar button:hover { transform: scale(1.08); }
    #btnDay { background: var(--day); }
    #btnEve { background: var(--eve); color: #000; }
    #btnNig { background: var(--nig); }
    #btnOff { background: var(--off); }

    /* Totals row */
    .totals {
      background: #f0f5ff;
      font-weight: 600;
    }

    /* Day counts footer */
    tfoot td {
      background: #f8f8f8;
      font-size: 0.75rem;
    }

    /* Layout wrappers */
    .wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
    }
    .toggle-pages {
      margin: 16px 0 32px;
      display: flex;
      gap: 8px;
    }
    .toggle-pages button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
    .toggle-pages button.active {
      background: #eef3ff;
      border-color: #8fa4ff;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Demo 페이지 전환용 버튼 (실제 배포 시 네비게이션으로 대체)-->
    <div class="toggle-pages">
      <button data-page="individual" class="active">개인 근무표</button>
      <button data-page="roster">전체 근무표</button>
      <button data-page="manager">근무표 생성/수정</button>
    </div>

    <!-- 1) 개인 근무표 -->
    <section id="individual" class="page">
      <h2>홍길동&nbsp;간호사 – 2025년 6월 근무표</h2>
      <table class="calendar" id="individualCal">
        <!-- 동적 삽입 -->
      </table>
    </section>

    <!-- 2) 전체 근무표 -->
    <section id="roster" class="page" style="display:none;">
      <h2>교대 근무 일정관리 – 2025년 6월 1조 근무표</h2>
      <table class="calendar" id="rosterCal">
        <!-- 동적 삽입 -->
      </table>
    </section>

    <!-- 3) 간호부장/수간호사 근무표 생성/수정 -->
    <section id="manager" class="page" style="display:none;">
      <h2>병동 A – 2025년 6월 1차 근무표</h2>
      <div id="editToolbar">
        <button id="btnDay" data-shift="Day">D</button>
        <button id="btnEve" data-shift="Eve">E</button>
        <button id="btnNig" data-shift="Nig">N</button>
        <button id="btnOff" data-shift="Off">OFF</button>
        <button id="btnSave">저장</button>
      </div>
      <button id="btnEdit">수정 시작</button>
      <table class="calendar" id="managerCal">
        <!-- 동적 삽입 -->
      </table>
    </section>
  </div>

  <script>
    /**
     * -------------mock data-------------
     * 개인 근무 데이터, 전체 근무표 데이터, 관리자/수간호사 근무표 데이터를 하드코딩
     */
    const month = 6; // 6월
    const year = 2025;
    const daysInMonth = new Date(year, month, 0).getDate();

    // 개인 근무표(홍길동) – 키: 날짜, 값: {shift, locked}
    const personalSchedule = {
      2: { shift: "Eve" },
      3: { shift: "Off" },
      4: { shift: "Nig" },
      5: { shift: "Nig" },
      6: { shift: "Off" },
      7: { shift: "Off" },
      10: { shift: "Day" },
      11: { shift: "Off", locked: true },
      12: { shift: "Nig" },
      13: { shift: "Nig" },
      17: { shift: "Off" },
      18: { shift: "Off" },
      21: { shift: "Off" },
      27: { shift: "Day" },
      28: { shift: "Day" },
      29: { shift: "Nig" },
    };

    // 전체 근무표 – staff별 row 데이터
    const roster = [
      { name: "이서연", team: "1조", shifts: "D E N N D".split(" ") },
      { name: "김서준", team: "1조", shifts: "E N N N D".split(" ") },
      { name: "박하늘", team: "1조", shifts: "N D D E N".split(" ") },
      // ... (샘플)
    ];

    // 관리자용 – 간호사 리스트와 초기 스케줄 (31일까지)
    const staff = [
      "이서연", "김서준", "박하늘", "이향우", "정지훈"
    ];
    // 행렬 [staffIndex][dayIndex] -> shift 코드
    const shiftsMatrix = Array.from({length: staff.length}, () => Array(daysInMonth).fill("Off"));

    /** -------------------------------------
     *  UI 헬퍼 함수들
     * ------------------------------------*/
    function createBadge(code, locked=false) {
      return `<span class="badge ${code}${locked?" locked":""}">${code === "Off"?"Off": code}</span>`;
    }

    /** 개인 근무표 렌더 */
    function renderIndividual() {
      const tbl = document.getElementById("individualCal");
      tbl.innerHTML = "";
      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
      // 헤더
      tbl.innerHTML += `<tr>${weekdays.map(w=>`<th>${w}</th>`).join("")}</tr>`;
      // 빈칸 채우면서 달력
      let row = "<tr>";
      const firstDayIdx = new Date(year, month-1, 1).getDay();
      for(let i=0;i<firstDayIdx;i++) row += "<td></td>";
      for(let d=1; d<=daysInMonth; d++) {
        if((firstDayIdx + d -1)%7===0 && d!==1){ row += "</tr><tr>"; }
        const data = personalSchedule[d];
        row += `<td>${ data ? createBadge(data.shift, data.locked) : ""}</td>`;
      }
      // 마무리 빈칸
      const lastDayIdx = (firstDayIdx + daysInMonth) %7;
      for(let i=0;i< (7-lastDayIdx) %7;i++) row += "<td></td>";
      row += "</tr>";
      tbl.innerHTML += row;
    }

    /** 전체 근무표 렌더 (17일까지만 예시) */
    function renderRoster() {
      const tbl = document.getElementById("rosterCal");
      tbl.innerHTML = "";
      let header = `<tr><th>사원명</th><th>근무조명</th>`;
      for(let d=1; d<=17; d++) header += `<th>${d}</th>`;
      header += `</tr>`;
      tbl.innerHTML += header;
      roster.forEach(row => {
        let tr = `<tr><td>${row.name}</td><td>${row.team}</td>`;
        row.shifts.forEach(code=>{ tr += `<td>${createBadge(code)}</td>`; });
        tr += `</tr>`;
        tbl.innerHTML += tr;
      });
    }

    /** 관리자 근무표 렌더 */
    function renderManager() {
      const tbl = document.getElementById("managerCal");
      tbl.innerHTML = "";
      // header (staff + totals)
      let header = `<tr><th rowspan="2">간호사</th>`;
      for(let d=1; d<=daysInMonth; d++) header += `<th>${d}</th>`;
      header += `<th rowspan="2">Total D</th><th rowspan="2">Total E</th><th rowspan="2">Total N</th><th rowspan="2">Total OFF</th></tr>`;
      tbl.innerHTML += header;
      // second header row (blank)
      tbl.innerHTML += `<tr>${"<th></th>".repeat(daysInMonth)}</tr>`;

      staff.forEach((n,i)=>{
        let tr = `<tr><td>${n}</td>`;
        let count = {Day:0, Eve:0, Nig:0, Off:0};
        shiftsMatrix[i].forEach(code=>{ tr += `<td class="editable" data-staff="${i}" data-day="${code.day}">${createBadge(code)}</td>`; count[code]++; });
        tr += `<td>${count.Day}</td><td>${count.Eve}</td><td>${count.Nig}</td><td>${count.Off}</td>`;
        tr += `</tr>`;
        tbl.innerHTML += tr;
      });
      // day counts footer
      let footer = `<tfoot><tr><td>총원</td>`;
      for(let d=1; d<=daysInMonth; d++) {
        footer += `<td id="cnt-${d}"></td>`;
      }
      footer += `<td colspan="4"></td></tr></tfoot>`;
      tbl.innerHTML += footer;
      calcDayCounts();
    }

    /** 일별 D/E/N/OFF 숫자 계산 */
    function calcDayCounts() {
      const dayCnt = Array.from({length: daysInMonth}, () => ({Day:0,Eve:0,Nig:0,Off:0}));
      shiftsMatrix.forEach(row=>{
        row.forEach((code,idx)=>{ dayCnt[idx][code]++; });
      });
      dayCnt.forEach((obj,idx)=>{
        const cell = document.getElementById(`cnt-${idx+1}`);
        cell.innerHTML = `D:${obj.Day}<br>E:${obj.Eve}<br>N:${obj.Nig}<br>O:${obj.Off}`;
      });
    }

    /** 편집 로직 */
    let editMode = false;
    let selectedShift = null;

    document.getElementById("btnEdit").addEventListener("click",()=>{
      editMode = !editMode;
      document.getElementById("editToolbar").style.display = editMode?"flex":"none";
      document.getElementById("btnEdit").textContent = editMode?"수정 종료":"수정 시작";
    });

    ["btnDay","btnEve","btnNig","btnOff"].forEach(id=>{
      document.getElementById(id).addEventListener("click",(e)=>{
        selectedShift = e.target.dataset.shift;
        // 버튼 active 표시
        document.querySelectorAll('#editToolbar button[data-shift]').forEach(btn=>btn.style.outline='none');
        e.target.style.outline = '2px solid #000';
      });
    });

    // table cell 클릭 → shift 변경
    document.addEventListener("click",(e)=>{
      if(!editMode || !selectedShift) return;
      const cell = e.target.closest("td.editable");
      if(!cell) return;
      const stIdx = parseInt(cell.dataset.staff,10);
      const dayIdx = parseInt(cell.dataset.day,10)-1;
      shiftsMatrix[stIdx][dayIdx] = selectedShift;
      cell.innerHTML = createBadge(selectedShift);
      renderManager(); // 간단히 재렌더 (데모)
    });

    /*** 페이지 토글 ***/
    document.querySelectorAll('.toggle-pages button').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.toggle-pages button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const pg = btn.dataset.page;
        document.querySelectorAll('.page').forEach(sec=>sec.style.display='none');
        document.getElementById(pg).style.display='block';
      });
    });

    // 초기 렌더
    renderIndividual();
    renderRoster();
    renderManager();
  </script>
</body>
</html>
