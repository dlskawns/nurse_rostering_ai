<!-- =========================================
  Nurse Scheduling UI – Static Mockup (HTML/CSS/JS)
  페이지: 1) 개인 근무표, 2) 전체 근무표, 3) 간호부장/수간호사 근무표 생성·수정
  모든 동적 데이터·API 연동 지점은 '-------------mock data-------------' 주석으로 표시
  디자인 팔레트는 첨부 스크린샷을 참고해 가까운 색상으로 지정
========================================= -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nurse Schedule UI Mock</title>
  <style>
    :root {
      /* Shift 색상 */
      --day: #4ecbfa;
      --eve: #f4c23d;
      --nig: #4e6fae;
      --off: #f4818c;
      /* 기타 */
      --text-dark: #333;
      --bg-light: #fafafa;
      --lock: #213a5a;
    }

    body {
      font-family: "Pretendard", Arial, sans-serif;
      margin: 0;
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.4;
    }

    h2 {
      margin: 1.2rem 0 0.5rem;
      font-size: 1.4rem;
    }

    /* 공통 캘린더 테이블 */
    table.calendar {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.calendar th,
    table.calendar td {
      position: relative;
      aspect-ratio: 1 / 1;
      vertical-align: top;
      text-align: center;
      padding: 6px 2px;
      border: 1px solid #e0e0e0;
    }
    table.calendar th {
      background: #fff;
      font-weight: 600;
    }

    /* 날짜 레이블 */
    .date-label {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 0.75rem;
      color: var(--text-dark);
      z-index: 1;
    }

    /* 셀 안 배지 */
    .badge {
      display: inline-block;
      min-width: 36px;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #fff;
      position: relative;
      cursor: default;
      user-select: none;
      transition: transform .15s;
      margin-top: 16px;
    }
    .badge.locked::after {
      content: "🔒";
      font-size: 0.65rem;
      position: absolute;
      right: -10px;
      top: -4px;
    }
    .badge.Day { background: var(--day); }
    .badge.Eve { background: var(--eve); color: #444; }
    .badge.Nig { background: var(--nig); }
    .badge.Off { background: var(--off); }

    /* 편집 모드를 위한 상단 버튼 */
    #editToolbar {
      display: none;
      gap: 8px;
      margin: 12px 0;
    }
    #editToolbar button {
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #fff;
      cursor: pointer;
      transform: scale(1);
      transition: transform .15s;
    }
    #editToolbar button:hover { transform: scale(1.08); }
    #btnDay { background: var(--day); }
    #btnEve { background: var(--eve); color: #000; }
    #btnNig { background: var(--nig); }
    #btnOff { background: var(--off); }

    /* Totals row */
    .totals {
      background: #f0f5ff;
      font-weight: 600;
    }

    /* Day counts footer */
    tfoot td {
      background: #f8f8f8;
      font-size: 0.75rem;
    }

    /* Layout wrappers */
    .wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
    }
    .toggle-pages {
      margin: 16px 0 32px;
      display: flex;
      gap: 8px;
    }
    .toggle-pages button {
      padding: 6px 10px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
    .toggle-pages button.active {
      background: #eef3ff;
      border-color: #8fa4ff;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="toggle-pages">
      <button data-page="individual" class="active">개인 근무표</button>
      <button data-page="roster">전체 근무표</button>
      <button data-page="manager">근무표 생성/수정</button>
    </div>

    <!-- 개인 근무표 -->
    <section id="individual" class="page">
      <h2>홍길동 간호사 – 2025년 6월 근무표</h2>
      <table class="calendar" id="individualCal"></table>
    </section>

    <!-- 전체 근무표 -->
    <section id="roster" class="page" style="display:none;">
      <h2>교대 근무 일정관리 – 2025년 6월 1조 근무표</h2>
      <table class="calendar" id="rosterCal"></table>
    </section>

    <!-- 근무표 생성/수정 -->
    <section id="manager" class="page" style="display:none;">
      <h2>병동 A – 2025년 6월 1차 근무표</h2>
      <div id="editToolbar">
        <button id="btnDay" data-shift="Day">D</button>
        <button id="btnEve" data-shift="Eve">E</button>
        <button id="btnNig" data-shift="Nig">N</button>
        <button id="btnOff" data-shift="Off">OFF</button>
        <button id="btnSave">저장</button>
      </div>
      <button id="btnEdit">수정 시작</button>
      <table class="calendar" id="managerCal"></table>
    </section>
  </div>

  <script>
    // -------------mock data-------------
    const month = 6, year = 2025;
    const daysInMonth = new Date(year, month, 0).getDate();
    const personalSchedule = {2:{shift:"Eve"},3:{shift:"Off"},4:{shift:"Nig"},5:{shift:"Nig"},6:{shift:"Off"},7:{shift:"Off"},10:{shift:"Day"},11:{shift:"Off",locked:true},12:{shift:"Nig"},13:{shift:"Nig"},17:{shift:"Off"},18:{shift:"Off"},21:{shift:"Off"},27:{shift:"Day"},28:{shift:"Day"},29:{shift:"Nig"}};
    const roster = [{name:"이서연",team:"1조",shifts:["D","E","N","N","D"]},{name:"김서준",team:"1조",shifts:["E","N","N","N","D"]}];
    const staff=["이서연","김서준","박하늘","이향우","정지훈"];
    const shiftsMatrix = Array.from({length:staff.length},()=>Array(daysInMonth).fill("Off"));

    function createBadge(code,locked=false){return `<span class="badge ${code}${locked?" locked":""}">${code}</span>`;}

    function renderIndividual(){
      const tbl=document.getElementById("individualCal"); tbl.innerHTML="";
      const weekdays=["일","월","화","수","목","금","토"];
      tbl.innerHTML+=`<tr>${weekdays.map(w=>`<th>${w}</th>`).join("")}</tr>`;
      let row="<tr>";
      const firstDayIdx=new Date(year,month-1,1).getDay();
      for(let i=0;i<firstDayIdx;i++)row+="<td></td>";
      for(let d=1;d<=daysInMonth;d++){
        if((firstDayIdx+d-1)%7===0&&d!==1)row+="</tr><tr>";
        const data=personalSchedule[d];
        const badge = data?createBadge(data.shift,data.locked):"";
        row+=`<td><div class="date-label">${d}</div>${badge}</td>`;
      }
      const lastDayIdx=(firstDayIdx+daysInMonth)%7;
      for(let i=0;i<(7-lastDayIdx)%7;i++)row+="<td></td>";
      row+="</tr>"; tbl.innerHTML+=row;
    }

    function renderRoster(){
      const tbl=document.getElementById("rosterCal"); tbl.innerHTML="";
      const header=`<tr><th>사원명</th><th>근무조명</th>${[...Array(17)].map((_,i)=>`<th>${i+1}</th>`).join("")}</tr>`;
      tbl.innerHTML+=header;
      roster.forEach(r=>{let tr=`<tr><td>${r.name}</td><td>${r.team}</td>`; r.shifts.forEach(c=>tr+=`<td><div class="date-label"></div>${createBadge(c)}</td>`); tr+=`</tr>`; tbl.innerHTML+=tr;});
    }

    function renderManager(){
      const tbl=document.getElementById("managerCal"); tbl.innerHTML="";
      let hdr=`<tr><th rowspan="2">간호사</th>${[...Array(daysInMonth)].map((_,i)=>`<th>${i+1}</th>`).join("")}<th rowspan="2">Total D</th><th rowspan="2">Total E</th><th rowspan="2">Total N</th><th rowspan="2">Total OFF</th></tr>`;
      tbl.innerHTML+=hdr+`<tr>${"<th></th>".repeat(daysInMonth)}</tr>`;
      staff.forEach((n,i)=>{let tr=`<tr><td>${n}</td>`; let cnt={Day:0,Eve:0,Nig:0,Off:0}; shiftsMatrix[i].forEach((c,di)=>{cnt[c]++; tr+=`<td><div class="date-label">${di+1}</div>${createBadge(c)}</td>`}); tr+=`<td>${cnt.Day}</td><td>${cnt.Eve}</td><td>${cnt.Nig}</td><td>${cnt.Off}</td></tr>`; tbl.innerHTML+=tr;});
      let ftr=`<tfoot><tr><td>총원</td>${[...Array(daysInMonth)].map((_,i)=>`<td id="cnt-${i+1}"></td>`).join("")}<td colspan="4"></td></tr></tfoot>`;
      tbl.innerHTML+=ftr; calcDayCounts();
    }

    function calcDayCounts(){
      const dayCnt=Array.from({length:daysInMonth},()=>({Day:0,Eve:0,Nig:0,Off:0}));
      shiftsMatrix.forEach(r=>r.forEach((c,i)=>dayCnt[i][c]++));
      dayCnt.forEach((o,i)=>document.getElementById(`cnt-${i+1}`).innerHTML=`D:${o.Day}<br>E:${o.Eve}<br>N:${o.Nig}<br>O:${o.Off}`);
    }

    let editMode=false, selectedShift=null;
    document.getElementById("btnEdit").addEventListener("click",()=>{editMode=!editMode; document.getElementById("editToolbar").style.display=editMode?"flex":"none"; document.getElementById("btnEdit").textContent=editMode?"수정 종료":"수정 시작";});
    ["btnDay","btnEve","btnNig","btnOff"].forEach(id=>document.getElementById(id).addEventListener("click",e=>{selectedShift=e.target.dataset.shift; document.querySelectorAll('#editToolbar button[data-shift]').forEach(b=>b.style.outline='none'); e.target.style.outline='2px solid #000';}));
    document.addEventListener("click",e=>{if(!editMode||!selectedShift)return; const cell=e.target.closest("td"); if(!cell||!cell.dataset.staff) return; const si=+cell.dataset.staff, di=+cell.dataset.day-1; shiftsMatrix[si][di]=selectedShift; renderManager();});
    document.querySelectorAll('.toggle-pages button').forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll('.toggle-pages button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); document.querySelectorAll('.page').forEach(s=>s.style.display='none'); document.getElementById(b.dataset.page).style.display='block';}));
    renderIndividual(); renderRoster(); renderManager();
  </script>
</body>
</html>
