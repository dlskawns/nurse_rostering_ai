# .github/workflows/deploy-ecr.yml

name: Build - Push - Deploy (EC2 + ALB)

on:
  push:
    branches:
      - main
      - dev
      - feat/** # feature/*  브랜치도 포함

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      ##################################################################
      # 1) 저장소 체크아웃
      ##################################################################
      - name: Checkout code
        uses: actions/checkout@v3

      ##################################################################
      # 2) 브랜치에 따라 ENV / TAG / API KEY 세팅
      ##################################################################
      - name: Set dynamic env vars
        run: |
          if   [[ "${{ github.ref_name }}" ==  "main" ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "DOCKER_TAG=prod-${{ github.sha }}" >> $GITHUB_ENV
            echo "ANTHROPIC_API_KEY=${{ secrets.PROD_ENV_ANTHROPIC }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.PROD_ENV_GOOGLE }}" >> $GITHUB_ENV
            echo "OPENAI_API_KEY=${{ secrets.PROD_ENV_OPENAI }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" ==  "dev" ]]; then
            echo "ENVIRONMENT=development" >> $GITHUB_ENV
            echo "DOCKER_TAG=dev-${{ github.sha }}" >> $GITHUB_ENV
            echo "ANTHROPIC_API_KEY=${{ secrets.DEV_ENV_ANTHROPIC }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.DEV_ENV_GOOGLE }}" >> $GITHUB_ENV
            echo "OPENAI_API_KEY=${{ secrets.DEV_ENV_OPENAI }}" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=local" >> $GITHUB_ENV
            echo "DOCKER_TAG=${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_ENV
            echo "ANTHROPIC_API_KEY=${{ secrets.LOCAL_ENV_ANTHROPIC }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.LOCAL_ENV_GOOGLE }}" >> $GITHUB_ENV
            echo "OPENAI_API_KEY=${{ secrets.LOCAL_ENV_OPENAI }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Log Environment
        run: |
          echo "Running in ${{ env.ENVIRONMENT }} environment"
          echo "Using Docker tag: ${{ env.DOCKER_TAG }}"
          # 보안상 API 키는 출력하지 않음

      ##################################################################
      # 3) AWS 자격 구성
      ##################################################################
      - name: Configure AWS credentials (AccessKey)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ##################################################################
      # 4) ECR 로그인
      ##################################################################
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      ##################################################################
      # 5) Docker 이미지 빌드/푸시
      ##################################################################
      - name: Build Docker image
        run: |
          docker build \
            --build-arg ENV=${{ env.ENVIRONMENT }} \
            --build-arg GOOGLE_API_KEY=${{ env.GOOGLE_API_KEY }} \
            --build-arg ANTHROPIC_API_KEY=${{ env.ANTHROPIC_API_KEY }} \
            --build-arg OPENAI_API_KEY=${{ env.OPENAI_API_KEY }} \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aide-backend-dev:${{ env.DOCKER_TAG }} .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aide-backend-dev:${{ env.DOCKER_TAG }}

      - name: Export image uri
        run: |
          echo "IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aide-backend-dev:${{ env.DOCKER_TAG }}" >> $GITHUB_ENV

      ##################################################################
      # 5-0) ECR 이미지 정리 (untagged 삭제 + 최신 10개 보존)
      ##################################################################
      - name: Install jq (for ECR pruning)
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Prune ECR images (keep last 10, delete untagged)
        env:
          REPO: aide-backend-dev
          REGION: ${{ secrets.AWS_REGION }}
          KEEP: "10"
          CURRENT_TAG: ${{ env.DOCKER_TAG }}
        run: |
          set -e

          echo "🧹 Delete UNTAGGED images"
          UNTAGGED_JSON=$(aws ecr list-images \
            --repository-name "$REPO" \
            --region "$REGION" \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds' \
            --output json)

          if [ "$(echo "$UNTAGGED_JSON" | jq 'length')" -gt 0 ]; then
            aws ecr batch-delete-image \
              --repository-name "$REPO" \
              --region "$REGION" \
              --cli-input-json "{\"imageIds\": $UNTAGGED_JSON }" || true
            echo "✅ Deleted UNTAGGED images"
          else
            echo "ℹ️ No UNTAGGED images"
          fi

          echo "🧹 Delete old TAGGED images (keep $KEEP, skip current: $CURRENT_TAG)"
          DETAILS=$(aws ecr describe-images \
            --repository-name "$REPO" \
            --region "$REGION" \
            --output json)

          ALL_TAGS=$(echo "$DETAILS" | jq -r '
            .imageDetails
            | map(select(.imageTags != null))
            | sort_by(.imagePushedAt) | reverse
            | map(.imageTags) | flatten
            | .[]')

          COUNT=0
          DELETE_TAGS=()

          for t in $ALL_TAGS; do
            if [ "$t" = "$CURRENT_TAG" ]; then
              continue
            fi
            COUNT=$((COUNT+1))
            if [ $COUNT -le $KEEP ]; then
              continue
            fi
            DELETE_TAGS+=("$t")
          done

          if [ ${#DELETE_TAGS[@]} -gt 0 ]; then
            IDS=$(printf '%s\n' "${DELETE_TAGS[@]}" | jq -R '{imageTag: .}' | jq -s .)
            aws ecr batch-delete-image \
              --repository-name "$REPO" \
              --region "$REGION" \
              --cli-input-json "{\"imageIds\": $IDS }" || true
            echo "✅ Deleted old tagged images: ${DELETE_TAGS[*]}"
          else
            echo "ℹ️ Nothing to delete among tagged images"
          fi

      ##################################################################
      # 5-1) 이전 latest 태그 이미지 삭제 (요금 절감)
      ##################################################################
      - name: Delete previous :latest image in ECR
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: "ubuntu"
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            echo "🗑️  deleting old :latest in ECR (if exists)"
            aws ecr batch-delete-image \
              --region ${{ secrets.AWS_REGION }} \
              --repository-name aide-backend-dev \
              --image-ids imageTag=latest || true

      ##################################################################
      # 5-2) EC2 → ECR 로그인
      ##################################################################
      - name: ECR login from EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | sudo docker login \
                  --username AWS \
                  --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            echo "✅  ECR login done"

      ##################################################################
      # 5-3) EC2: 로컬 컨테이너/이미지 강력 정리 (볼륨은 유지)
      ##################################################################
      - name: Stop & prune old containers/images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            echo "⛔  Stopping running containers (if any)"
            sudo docker ps -q | xargs -r sudo docker stop
            echo "🗑️  Removing containers"
            sudo docker ps -a -q | xargs -r sudo docker rm
            echo "🗑️  Removing images"
            sudo docker images -q | xargs -r sudo docker rmi
            echo "🧹 docker system prune (no volumes)"
            sudo docker system prune -af

      ##################################################################
      # 5-4) 새 이미지 Pull
      ##################################################################
      - name: Pull new image on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          envs: IMAGE_URI
          script: |
            set -e
            echo " docker pull $IMAGE_URI"
            sudo docker pull "$IMAGE_URI"

      ##################################################################
      # 5-4.5) EC2: .env 작성 (로컬 MySQL 접속 정보 포함)
      ##################################################################
      - name: Write .env on EC2
        uses: appleboy/ssh-action@v1.0.0
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p /home/ubuntu/app
            cat > /home/ubuntu/app/.env <<EOF
ENVIRONMENT=${ENVIRONMENT}
DB_HOST=host.docker.internal
DB_PORT=3306
DB_NAME=${{ secrets.DEV_DB_NAME }}
DB_USER=${{ secrets.DEV_DB_USER }}
DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
EOF
            echo "✅ Wrote /home/ubuntu/app/.env"

      ##################################################################
      # 5-5) 컨테이너 실행 (env-file 주입 + host-gateway 매핑)
      ##################################################################
      - name: Run container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          envs: IMAGE_URI
          script: |
            set -e
            sudo docker stop aide-server || true
            sudo docker rm   aide-server || true
            sudo docker run -d \
              --name aide-server \
              -p 8000:8000 \
              --env-file /home/ubuntu/app/.env \
              --add-host=host.docker.internal:host-gateway \
              --restart unless-stopped \
              "$IMAGE_URI"
            echo "🚀  Container started → http://$HOSTNAME:8000/health"
