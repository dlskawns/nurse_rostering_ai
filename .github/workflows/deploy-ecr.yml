name: Build ‑ Push ‑ Deploy (EC2 + ALB)

on:
  push:
    branches:
      - main
      - dev
      - feat/** # feature/*  브랜치도 포함

######################################################################
# 📌  공통 상수 (필요하면 여기서만 바꾸면 됨)
######################################################################
# env:
#   AWS_REGION: ap-northeast-2 # ← 리전을 바꾸면 한 곳만
#   ECR_REPO: aide-backend-dev # ECR Repository 이름

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # (OIDC 사용 시) 필요

    steps:
      ##################################################################
      # 1) 저장소 체크아웃
      ##################################################################
      - name: Checkout code
        uses: actions/checkout@v3

      ##################################################################
      # 2) 브랜치에 따라 ENV / TAG / API KEY 세팅
      ##################################################################
      - name: Set dynamic env vars
        run: |
          if   [[ "${{ github.ref_name }}" ==  "main" ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "DOCKER_TAG=prod-${{ github.sha }}" >> $GITHUB_ENV
            echo "ANTHROPIC_API_KEY=${{ secrets.PROD_ENV_ANTHROPIC }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.PROD_ENV_GOOGLE }}" >> $GITHUB_ENV
            echo "OPENAI_API_KEY=${{ secrets.PROD_ENV_OPENAI }}" >> $GITHUB_ENV
            

          elif [[ "${{ github.ref_name }}" ==  "dev" ]]; then
            echo "ENVIRONMENT=development" >> $GITHUB_ENV
            echo "DOCKER_TAG=dev-${{ github.sha }}" >> $GITHUB_ENV
            echo "ANTHROPIC_API_KEY=${{ secrets.DEV_ENV_ANTHROPIC }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.DEV_ENV_GOOGLE }}" >> $GITHUB_ENV
            echo "OPENAI_API_KEY=${{ secrets.DEV_ENV_OPENAI }}" >> $GITHUB_ENV
            

          else
            echo ${{ github.ref_name }}
            echo "ENVIRONMENT=local" >> $GITHUB_ENV
            echo "DOCKER_TAG=${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_ENV
            echo "ANTHROPIC_API_KEY=${{ secrets.LOCAL_ENV_ANTHROPIC }}" >> $GITHUB_ENV
            echo "GOOGLE_API_KEY=${{ secrets.LOCAL_ENV_GOOGLE }}" >> $GITHUB_ENV
            echo "OPENAI_API_KEY=${{ secrets.LOCAL_ENV_OPENAI }}" >> $GITHUB_ENV
            
          fi
        shell: bash
      # 2-2. 환경설정 확인 로그 출력
      - name: Log Environment
        run: |
          echo "Running in ${{ env.ENVIRONMENT }} environment"
          echo "Using Docker tag: ${{ env.DOCKER_TAG }}"
          echo "Anthropic API Key: ${{ env.ANTHROPIC_API_KEY }}"
          echo "GOOGLE API Key: ${{ env.GOOGLE_API_KEY }}"
          echo "OPENAI API Key: ${{ env.OPENAI_API_KEY }}"

        # echo "::group::🔖  Resolved build variables"
        # env | grep -E 'APP_ENV|DOCKER_TAG' || true   # grep 결과 없어도 통과
        # echo "::endgroup::"
      ##################################################################
      # 3) AWS 자격 구성  ── (둘 중 하나만 선택)
      ##################################################################

      # --- 3‑B  : Access Key (빠르게 테스트할 때) ----------------------
      - name: Configure AWS credentials (AccessKey)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      # ---------------------------------------------------------------

      ##################################################################
      # 4) ECR 로그인
      ##################################################################
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Docker 이미지 빌드 (빌드 인자에 환경변수 전달)
      - name: Build Docker image
        run: |
          docker build \
            --build-arg ENV=${{ env.ENVIRONMENT }} \
            --build-arg GOOGLE_API_KEY=${{ env.GOOGLE_API_KEY }} \
            --build-arg ANTHROPIC_API_KEY=${{ env.ANTHROPIC_API_KEY }} \
            --build-arg OPENAI_API_KEY=${{ env.OPENAI_API_KEY }} \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aide-backend-dev:${{ env.DOCKER_TAG }} .

      # 6. Docker 이미지 ECR에 푸시
      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aide-backend-dev:${{ env.DOCKER_TAG }}

      - name: Export image uri
        run: |
          echo "IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aide-backend-dev:${{ env.DOCKER_TAG }}" >> $GITHUB_ENV

      # 5‑1) 이전 latest 태그 이미지 삭제 (ECR 요금 절감)
      - name: Delete previous :latest image in ECR
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: "ubuntu"
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            echo "🗑️  deleting old :latest in ECR (if exists)"
            aws ecr batch-delete-image \
              --region ${{ env.AWS_REGION }} \
              --repository-name aide-backend-dev \
              --image-ids imageTag=latest || true

      # 5‑2) EC2 → ECR 로그인 (토큰 12h 유지, 재실행 안전)
      - name: ECR login from EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e

            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | sudo docker login \
                  --username AWS \
                  --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
            echo "✅  ECR login done"

      # 5‑3) 기존 컨테이너/이미지 정리
      - name: Stop & prune old containers/images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            echo "⛔  Stopping running containers (if any)"
            sudo docker ps -q | xargs -r sudo docker stop
            echo "🗑️  Removing containers"
            sudo docker ps -a -q | xargs -r sudo docker rm
            echo "🗑️  Removing images"
            sudo docker images -q | xargs -r sudo docker rmi
            echo "🧹 docker system prune"
            sudo docker system prune -af

      # 5‑4) 새 이미지 Pull
      - name: Pull new image on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          envs: IMAGE_URI
          script: |
            set -e
            echo " docker pull $IMAGE_URI"
            sudo docker pull "$IMAGE_URI"

        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}

      # 5‑5) 컨테이너 실행 (예: 단일 FastAPI 서버)
      - name: Run container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            sudo docker stop aide-server || true
            sudo docker rm   aide-server || true
            sudo docker run -d \
              --name aide-server \
              -p 8000:8000 \
              -e APP_ENV= aide-backend-dev \
              --restart unless-stopped \
              ${{ env.IMAGE_URI }}
            echo "🚀  Container started → http://$HOSTNAME:8000/health"
