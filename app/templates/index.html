<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간호사 근무 희망사항 제출</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .page-status-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .page-status-overlay h2 {
            padding: 20px;
            background: #e9ecef;
            border-radius: 10px;
        }
        #result-display {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .result-table {
            flex: 1;
            border-collapse: collapse;
        }
        .result-table th, .result-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .result-table th {
            background-color: #f2f2f2;
        }
        .submit-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
        }
        .submit-container button {
            width: auto;
            padding: 15px 25px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .content-wrapper {
            display: flex;
        }
        .bookmarks-container {
            width: 200px;
            padding-right: 20px;
        }
        .bookmark {
            padding: 10px 15px;
            margin-bottom: 10px;
            background: #e9ecef;
            border-left: 5px solid #6c757d;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .bookmark:hover {
            background: #dee2e6;
        }
        .bookmark.active {
            background: #fff;
            border-left-color: #007bff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transform: translateX(-10px);
        }
        .main-content {
            flex: 1;
        }
    </style>
</head>
<body>
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="toggleNav()">&times;</a>
        <a href="/head-nurse-management">부서원 관리</a>
        <a href="/" class="active">Wanted 작성</a>
        <a href="/roster-view">근무표 보기</a>
        {% if user.is_head_nurse %}
        <a href="/roster-create">근무표 생성</a>
        {% endif %}
        <a href="javascript:void(0);" onclick="logout()">로그아웃</a>
    </div>

    <button class="openbtn" onclick="toggleNav()">&#9776;</button>

    <div id="main">
        <div class="container" style="position: relative;">
            <div id="page-status" class="page-status-overlay" style="display: none;">
                <h2 id="status-message"></h2>
            </div>

            <h1>간호사 근무 희망사항</h1>

            <div class="content-wrapper">
                <div id="bookmarks-container" class="bookmarks-container">
                    <!-- Bookmarks will be inserted here -->
                </div>
                <div class="main-content">
                    <div id="nurse-view">
                        <div class="form-group">
                            <label for="wanted-input">희망 근무 내용 (Wanted)</label>
                            <textarea id="wanted-input" placeholder="예: 주말 출근은 최대한 N으로 하고싶어요."></textarea>
                        </div>
                        <button onclick="submitRequest()">근무 희망 초안 저장 및 분석</button>
                    </div>
        
                    <div class="loader" id="loader" style="display: none;"></div>
        
                    <div id="result-container" style="display: none;">
                        <h2>처리 결과</h2>
                        <div id="result-display"></div>
                    </div>
                </div>
            </div>

            <div id="submit-section" class="submit-container" style="display: none;">
                 <button id="final-submit-btn" onclick="finalSubmit()">최종 제출</button>
            </div>
        </div>
    </div>

    <script>
        let fullNurseSchema = [];
        let activeSchedules = [];
        let activeYear, activeMonth;

        document.addEventListener('DOMContentLoaded', async () => {
            // Setup sidebar and basic listeners
            document.getElementById("mySidebar").style.width = "250px";
            document.getElementById("main").style.marginLeft = "250px";
            document.getElementById('wanted-input').addEventListener('keydown', handleKeydown);
            
            await fetchNurseSchema();
            await initializeBookmarks();
        });

        function handleKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                submitRequest();
            }
        }

        async function initializeBookmarks() {
            const pageStatusDiv = document.getElementById('page-status');
            const statusMessage = document.getElementById('status-message');
            const bookmarksContainer = document.getElementById('bookmarks-container');
            
            try {
                const response = await fetch('/api/schedules/active');
                if (!response.ok) throw new Error('활성화된 스케줄을 불러올 수 없습니다.');
                activeSchedules = await response.json();

                if (activeSchedules.length === 0) {
                    statusMessage.textContent = 'Wanted 작성 전입니다. 수간호사에게 요청해주세요.';
                    pageStatusDiv.style.display = 'flex';
                    bookmarksContainer.innerHTML = '';
                } else {
                    pageStatusDiv.style.display = 'none';
                    renderBookmarks();
                    // Load the first schedule by default
                    await switchActiveSchedule(activeSchedules[0].year, activeSchedules[0].month);
                }
            } catch (error) {
                console.error(error);
                statusMessage.textContent = '오류가 발생했습니다: ' + error.message;
                pageStatusDiv.style.display = 'flex';
            }
        }

        function renderBookmarks() {
            const bookmarksContainer = document.getElementById('bookmarks-container');
            bookmarksContainer.innerHTML = '';
            activeSchedules.forEach(schedule => {
                const bookmark = document.createElement('div');
                bookmark.className = 'bookmark';
                bookmark.textContent = `${schedule.year}년 ${schedule.month}월`;
                bookmark.dataset.year = schedule.year;
                bookmark.dataset.month = schedule.month;
                bookmark.onclick = () => switchActiveSchedule(schedule.year, schedule.month);
                bookmarksContainer.appendChild(bookmark);
            });
        }

        async function switchActiveSchedule(year, month) {
            activeYear = year;
            activeMonth = month;
            
            // Update active class on bookmarks
            document.querySelectorAll('.bookmark').forEach(bm => {
                if (bm.dataset.year == year && bm.dataset.month == month) {
                    bm.classList.add('active');
                } else {
                    bm.classList.remove('active');
                }
            });

            await checkScheduleStatus();
        }

        async function checkScheduleStatus() {
            try {
                const response = await fetch(`/api/schedules/status?year=${activeYear}&month=${activeMonth}`);
                if (!response.ok) throw new Error('스케줄 상태를 확인할 수 없습니다.');
                const statusData = await response.json();

                const isSubmitted = statusData.preference_is_submitted;
                const scheduleStatus = statusData.schedule_status;

                // If schedule is no longer 'requested', refresh bookmarks and show message
                if (scheduleStatus !== 'requested') {
                    await initializeBookmarks();
                    return;
                }

                if (isSubmitted) {
                    setSubmittedState(statusData.preference_data);
                } else {
                    setDraftState(statusData.preference_data);
                }
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }

        function setSubmittedState(preferenceData) {
            document.getElementById('wanted-input').disabled = true;
            document.querySelector('#nurse-view button').disabled = true;
            document.getElementById('result-container').style.display = 'block';
            
            const submitBtn = document.getElementById('final-submit-btn');
            submitBtn.textContent = '수정';
            submitBtn.onclick = retractSubmission;
            document.getElementById('submit-section').style.display = 'block';
            
            if (preferenceData) {
                document.getElementById('wanted-input').value = preferenceData.request || '';
                displayResults(preferenceData);
            } else {
                displayResults(null);
            }
        }

        function setDraftState(preferenceData) {
            document.getElementById('wanted-input').disabled = false;
            document.querySelector('#nurse-view button').disabled = false;

            const submitBtn = document.getElementById('final-submit-btn');
            submitBtn.textContent = '최종 제출';
            submitBtn.onclick = finalSubmit;
            document.getElementById('submit-section').style.display = 'block';

            if (preferenceData) {
                document.getElementById('wanted-input').value = preferenceData.request || '';
                displayResults(preferenceData);
                document.getElementById('result-container').style.display = 'block';
            } else {
                document.getElementById('wanted-input').value = '';
                document.getElementById('result-container').style.display = 'none';
            }
        }

        async function fetchNurseSchema() {
             try {
                const response = await fetch('/api/nurses');
                 if (!response.ok) {
                    if (response.status === 401) window.location.href = '/login';
                    throw new Error('간호사 정보를 불러오는데 실패했습니다.');
                }
                fullNurseSchema = await response.json();
            } catch(error) {
                console.error(error);
                alert(error.message);
            }
        }

        async function submitRequest() {
            const wantedInput = document.getElementById('wanted-input').value;
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('result-container');
            
            if (!wantedInput) {
                alert('희망 근무 내용을 입력해주세요.');
                return;
            }

            const payload = { request: wantedInput, schema: fullNurseSchema };
            loader.style.display = 'block';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch('/roster/invoke', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'API 요청에 실패했습니다.');

                const preferencePayload = {
                    year: activeYear,
                    month: activeMonth,
                    data: { ...data.response, request: wantedInput } // Save the original text request as well
                };

                await fetch('/api/preferences', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(preferencePayload)
                });

                displayResults(preferencePayload.data);
                resultContainer.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result-display').textContent = `오류가 발생했습니다: ${error.message}`;
                resultContainer.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        }

        function displayResults(data) {
            const resultDisplay = document.getElementById('result-display');
            resultDisplay.innerHTML = '';

            if (!data) {
                resultDisplay.innerHTML = '표시할 결과가 없습니다.';
                return;
            }
            
            let shiftHtml = '<div><h3>희망 근무</h3><table class="result-table"><tr><th>Shift</th><th>날짜</th></tr>';
            if (data.shift && Object.keys(data.shift).length > 0) {
                for (const [shift, dates] of Object.entries(data.shift)) {
                    // Dates can be an object or an array from different versions
                    const dateKeys = Array.isArray(dates) ? dates : Object.keys(dates);
                    for (const date of dateKeys) {
                         shiftHtml += `<tr><td>${shift}</td><td>${date}</td></tr>`;
                    }
                }
            } else {
                shiftHtml += '<tr><td colspan="2">없음</td></tr>';
            }
            shiftHtml += '</table></div>';

            let prefHtml = '<div><h3>동료 선호</h3><table class="result-table"><tr><th>간호사</th><th>선호도</th></tr>';
            if (data.preference && data.preference.length > 0) {
                 data.preference.forEach(p => {
                    const nurseName = fullNurseSchema.find(n => n.nurse_id === p.id)?.name || p.id.substring(0,8);
                    const preference = p.weight > 0 ? '선호' : '비선호';
                    prefHtml += `<tr><td>${nurseName}</td><td>${preference}</td></tr>`;
                });
            } else {
                prefHtml += '<tr><td colspan="2">없음</td></tr>';
            }
            prefHtml += '</table></div>';

            resultDisplay.innerHTML = shiftHtml + prefHtml;
        }

        async function finalSubmit() {
            if (!confirm('최종 제출하시겠습니까? 제출 후에는 수정할 수 없습니다.')) return;
            
            const statusResponse = await fetch(`/api/schedules/status?year=${activeYear}&month=${activeMonth}`);
            const statusData = await statusResponse.json();

            let endpoint = '/api/preferences/submit';
            let body = JSON.stringify({ year: activeYear, month: activeMonth });

            if (!statusData.preference_data) {
                endpoint = '/api/preferences/submit/empty';
            }

            try {
                await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body
                });
                alert('성공적으로 제출되었습니다.');
                await checkScheduleStatus();
            } catch (error) {
                alert('제출에 실패했습니다: ' + error.message);
            }
        }

        async function retractSubmission() {
            if (!confirm('제출을 철회하고 수정하시겠습니까?')) return;
            try {
                await fetch('/api/preferences/retract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ year: activeYear, month: activeMonth })
                });
                alert('제출이 철회되었습니다. 다시 수정할 수 있습니다.');
                await checkScheduleStatus();
            } catch (error) {
                alert('철회에 실패했습니다: ' + error.message);
            }
        }

        async function logout() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }
    </script>
    <script>
        function toggleNav() {
            const sidebar = document.getElementById("mySidebar");
            const main = document.getElementById("main");
            if (sidebar.style.width === "250px") {
                sidebar.style.width = "0";
                main.style.marginLeft = "0";
            } else {
                sidebar.style.width = "250px";
                main.style.marginLeft = "250px";
            }
        }
    </script>
</body>
</html>
