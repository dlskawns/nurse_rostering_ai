<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간호사 근무 희망사항 제출</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="toggleNav()">&times;</a>
        <a href="/head-nurse-management">부서원 관리</a>
        <a href="/" class="active">Wanted 작성</a>
        {% if user.is_head_nurse %}
        <a href="/roster-create">근무표 생성</a>
        <a href="#">근무표 보기</a>
        {% endif %}
        <a href="javascript:void(0);" onclick="logout()">로그아웃</a>
    </div>

    <button class="openbtn" onclick="toggleNav()">&#9776;</button>

    <div id="main">
        <div class="container">
            <h1>간호사 근무 희망사항</h1>

            <div id="nurse-view">
                <h2>간호사 설정</h2>
                <div class="form-group">
                    <label for="wanted-input">희망 근무 내용 (Wanted)</label>
                    <textarea id="wanted-input" placeholder="예: 주말 출근은 최대한 N으로 하고싶어요."></textarea>
                </div>
                <button onclick="submitRequest()">근무 희망 제출</button>
            </div>

            <div class="loader" id="loader"></div>

            <div id="result-container">
                <h2>처리 결과</h2>
                <pre id="result-json"></pre>
            </div>
        </div>
    </div>

    <script>
        async function submitRequest() {
            const wantedInput = document.getElementById('wanted-input').value;
            const resultContainer = document.getElementById('result-container');
            const resultJson = document.getElementById('result-json');
            const loader = document.getElementById('loader');

            if (!wantedInput) {
                alert('희망 근무 내용을 입력해주세요.');
                return;
            }

            const payload = {
                request: wantedInput
                // The backend will identify the user from the cookie.
                // No need to send schema.
            };

            // Show loader and hide previous result
            loader.style.display = 'block';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch('/roster/invoke', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'API 요청에 실패했습니다.');
                }

                resultJson.textContent = JSON.stringify(data, null, 2);
                resultContainer.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                resultJson.textContent = `오류가 발생했습니다: ${error.message}`;
                resultContainer.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        }

        async function logout() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }
    </script>
    <script>
        function toggleNav() {
            const sidebar = document.getElementById("mySidebar");
            const main = document.getElementById("main");
            if (sidebar.style.width === "250px") {
                sidebar.style.width = "0";
                main.style.marginLeft = "0";
            } else {
                sidebar.style.width = "250px";
                main.style.marginLeft = "250px";
            }
        }
        // Initialize sidebar state
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("mySidebar").style.width = "250px";
            document.getElementById("main").style.marginLeft = "250px";
        });
    </script>
</body>
</html>
